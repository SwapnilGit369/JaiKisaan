<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kisan AI Expert</title>
    <meta name="theme-color" content="#2e7d32">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 10px; }
        header { background-color: #2e7d32; color: white; padding: 15px; text-align: center; border-radius: 8px; margin-bottom: 15px; }
        .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input, select, button { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #2e7d32; color: white; border: none; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #1b5e20; }
        .result-box { display: none; margin-top: 15px; padding: 10px; background: #e8f5e9; border: 1px solid #c8e6c9; border-radius: 5px; }
    </style>
</head>
<body>

    <header>
        <h2>Kisan AI Expert</h2>
        <p style="margin: 0; font-size: 14px;">Smart Farming App</p>
    </header>

    <div class="card">
        <h3>🔍 Plant Disease AI</h3>
        <p style="font-size: 12px; color: gray;">Bimari wali fasal ki photo chunein (Backend connected)</p>
        <input type="file" id="plantPhoto" accept="image/*">
        <button id="aiButton" onclick="detectDisease()">Check Disease</button>
        <div id="aiResult" class="result-box"></div>
    </div>

    <script>
        async function detectDisease() {
            let fileInput = document.getElementById('plantPhoto').files[0];
            if (!fileInput) { 
                alert("Pehle khet ki photo select karein!"); 
                return; 
            }
            
            let btn = document.getElementById('aiButton');
            btn.innerHTML = "Processing with AI...";
            btn.style.backgroundColor = "#555";
            
            let formData = new FormData();
            formData.append("file", fileInput);

            try {
                // Tumhara live PythonAnywhere API URL
                let response = await fetch("https://swapnilpy369.pythonanywhere.com/predict", {
                    method: "POST",
                    body: formData
                });
                
                let data = await response.json();
                
                let resultBox = document.getElementById('aiResult');
                resultBox.style.display = "block";
                resultBox.innerHTML = `
                    <strong>Detected:</strong> ${data.disease}<br><br>
                    <strong>Action:</strong> ${data.treatment}<br>
                    <strong>Dose:</strong> ${data.dose}<br>
                    <hr style="border: 0.5px solid #ccc;">
                    <span style="color: red; font-size: 12px;">⚠️ ${data.alert}</span>
                `;
            } catch (error) {
                alert("Server se connect nahi ho paya. Apna internet ya PythonAnywhere server check karein.");
            } finally {
                btn.innerHTML = "Check Disease";
                btn.style.backgroundColor = "#2e7d32";
            }
        }
    </script>
</body>
</html>
